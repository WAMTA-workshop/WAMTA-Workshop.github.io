<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ year_config.short_title | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: year_config.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-alpha.6/css/bootstrap.min.css" integrity="sha384-rwoIResjU2yc3z8GV/NPeZWAv56rSmLldC3R/AZzGRnGxQQKnKkoFVhFQhNUwEyJ" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ '/assets/hotweb.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/font-awesome/css/font-awesome.min.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/favicon.ico' | relative_url }}" />

  {% if site.google_analytics %}
    {% include google-analytics.html %}
  {% endif %}

</head>
