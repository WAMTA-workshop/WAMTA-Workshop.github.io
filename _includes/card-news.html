<div class="card">
  <div class="card-header text-white bg-inverse">
    <i class="fa fa-newspaper-o mr-3" aria-hidden="true"></i><strong>News</strong>
  </div>
  <div class="card-block bg-faded">
    <ul class="list-group list-group-flush">
      {% if year_data.news %}
        {% for news_entry in year_data.news %}
          <li class="list-group-item bg-faded text-muted">
            {% if news_entry.date %}{{ news_entry.date | date: "%B %-d, %Y" }} {% endif %}- {{ news_entry.text }}
          </li>
        {% endfor %}
      {% else %}
      <li class="list-group-item bg-faded text-muted">TBA</li>
      {% endif %}
    </ul>
  </div>
</div>
