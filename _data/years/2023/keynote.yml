    url: https://youtu.be/sawEv3UFcmE
- label: Keynote II
  title: Application Examples of Leveraging Task Parallelism with Chapel
  speaker: Michelle Strout
  affiliation: The University of Arizona and HPE
  abstract: >-
    The Chapel programming language provides constructs for expressing a wide
    range of parallelism patterns, while also remaining easy-to-use. This talk
    will show usage examples from machine learning, data analytics,
    aeronautical engineering, hydrology, and other application areas.
    Perspectives of how existing workflows were adjusted to leverage Chapel
    and the resulting performance and scaling will also be presented.
