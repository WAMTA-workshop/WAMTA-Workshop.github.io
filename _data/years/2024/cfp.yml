sections:
- title: Abstracts
  body: Authors are invited to submit abstracts and indicate if they will submit a
    short or full paper. This is a two step process and authors will first submit
    the abstract (December 14th) and later submit the short or full paper (January
    15th).
- title: Full Papers
  body: Authors are invited to submit original papers of between ten and twelve pages,
    including text, the references section, appendices, and figures.
- title: Short Papers
  body: |-
    Alternative authors submit position papers and work-in-progress as short papers of at most 6 pages in length, which include tables, figures, references, and appendices.

    At least three program committee members will review each submission. Reviews will be double-blind, and papers will be assessed for quality, relevance, and presentation of contributions. Springer LNCS will publish the accepted papers.
    All submitted manuscripts will be checked for originality by [iThenticate](https://www.ithenticate.com/) (papers that show insufficient originality might be rejected without a review).
- title: Best Paper/Poster Award
  body: The Best Paper/Poster Award will be selected on the basis of explicit recommendations
    of the reviewers and their scoring towards the paper’s originality and quality.
