  - title: Travel by air
    body: The closest airport to MIT is [Boston's Logan International Airport](https://www.massport.com/logan-airport).

  - title: From Logan International Airport to MIT
    body: |-
      **Taxi or rideshare:** Taxi fare from the airport is about $35–$40, and a rideshare service can range from about $30–$40. During non-rush hour, the ride takes about 15 minutes; during rush hour, it may take 30 minutes or more.

      **Subway:** From any terminal at Logan Airport, take the Silver Line bus to South Station. At South Station, change to the Red Line toward Alewife and exit at Kendall/MIT. The trip should take about 30 minutes.
