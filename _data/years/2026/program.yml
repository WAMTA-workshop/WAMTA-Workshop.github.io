intro: |-
  The venue for all talks is at the [Max Planck Computing and Data Facility,
  on Research Campus Garching, Gießenbachstrasse 2 85748 Garching near Munich, Germany. ** Access via Isarstrasse **](https://www.mpcdf.mpg.de/contact/directions). Lecture hall on ground level next to the main entrance to building D2.
social_events:
  - label: Poster Reception on Monday evening in the showroom of the Max Planck Institute of Plasmaphysics
    url: events
  - label: Conference Dinner on Tuesday evening in the oldest brewery of the planet, Weihenstephan
    url: events
schedule:
  kind: timetable
  days:
    - { key: mon, label: "Mon Feb 16 (Day 1)" }
    - { key: tue, label: "Tue Feb 17 (Day 2)" }
    - { key: wed, label: "Wed Feb 18 (Day 3)" }
  rows:
    - time: "08:00 AM"
      all: { kind: meta, text: "Registration / Coffee and Pastries" }

    - time: "08:50 AM"
      mon: { kind: event, label: "Welcoming Remarks", note: "Erwin Laure" }

    - time: "09:00 AM"
      mon: { kind: keynote, number: 1, chair: "E. Laure",    speaker: "Michael Klemm", title: "Fortran and the OpenMP API in a Modern GPU World" }
      tue: { kind: keynote, number: 2, chair: "M. Schulz",   speaker: "Rosa Badia",    title: "Task-based programming models: tradeoffs between granularity and computing platforms" }
      wed: { kind: keynote, number: 3, chair: "C. Junghans", speaker: "Nick Brown",    title: "Asynchronous tasks: the cornerstone of targeting HPC on emerging architectures" }

    - time: "10:00 AM"
      all: { kind: meta, text: "Coffee" }

    - mon: { kind: meta, text: "Session 1, Chair: M. Rampp" }
      tue: { kind: meta, text: "Session 3, Chair: J. Posner" }
      wed: { kind: meta, text: "Session 5, Chair: C. Junghans" }

    - time: "10:30 AM"
      mon: { kind: talk, speaker: "Alexander Strack", title: "Accelerating GPRat: Asynchronous, Task-Based GPU Acceleration for Gaussian Process Regression with HPX" }
      tue: { kind: talk, speaker: "Dominik Huber",    title: "Towards Dynamic Resource Management with Charm++" }
      wed: { kind: talk, speaker: "Joseph Schuchart", title: "Multiresolution Analysis using Data-Flow Programming" }

    - time: "11:00 AM"
      mon: { kind: talk, speaker: "Vincent Arcila",  title: "Hierarchical Scheduling for Composable Affinity-Aware Policies in Task-Based Runtimes" }
      tue: { kind: talk, speaker: "Rüdiger Nather",  title: "Finding Conservation Laws of Large Dynamical Systems with Tasks and Futures: A Case Study in Utilizing Dynamic Data Dependencies" }
      wed: { kind: talk, speaker: "Nicolas Ducarton", title: "Abstract communicators for task based runtime systems" }

    - time: "11:30 AM"
      tue: { kind: talk, speaker: "Joseph Schuchart", title: "Using C++ Generators in Dataflow Broadcast" }

    - time: "12:00 PM"
      all: { kind: meta, text: "Lunch" }

    - mon: { kind: meta, text: "Session 2, Chair: C. Junghans" }
      tue: { kind: meta, text: "Session 4, Chair: M. Rampp" }
      wed: { kind: meta, text: "Session 6, Chair: M. Rampp" }

    - time: "01:00 PM"
      mon: { kind: talk, speaker: "Jose Gracia",  title: "Evaluating MPI and OpenMP for global task dependencies across processes" }
      tue: { kind: talk, speaker: "Linus Batel",  title: "From Prompts to Performance: Evaluating LLMs for Task-based Parallel Code Generation" }
      wed: { kind: talk, speaker: "Zhuowei Gu",   title: "Merging Parameterized Task Graphs in PaRSEC through Recursive JDF Composition" }

    - time: "01:30 PM"
      mon: { kind: talk, speaker: "Jonas Posner",         title: "Exploring Performance-Productivity Trade-offs in AMT Runtimes: A Task Bench Study of Itoyori, and MPI" }
      tue: { kind: talk, speaker: "Philippe Swartvagher", title: "First Experiments to Evaluate the Relevance of Task-based Runtime Systems to Implement Large Language Model Applications" }
      wed: { kind: talk, speaker: "Qiao Zhang",           title: "Leveraging PaRSEC for Task-Based Heterogeneous Computing in Python and Julia" }

    - time: "02:00 PM"
      mon: { kind: talk, speaker: "Nicolas Brieuc", title: "Managing Explicit Communications Within a Sequential Task Flow Paradigm" }
      tue: { kind: talk, speaker: "Mia Reitz",      title: "Silent Data Corruption Protection through Efficient Task Replication" }
      wed: { kind: meta, text: "Closing remarks" }

    - time: "02:30 PM"
      all: { kind: meta, text: "Coffee" }

    - time: "03:00 PM"
      mon: { kind: event, label: "Quantum Computer Tour",            note: "until 4:30 PM" }
      tue: { kind: event, label: "Panel: Novel architectures for AMT", chair: "C. Junghans", note: "until 3:45 PM" }

    - time: "Evening"
      mon: { kind: event, label: "Reception", note: "05:30 PM - 08:00 PM" }
      tue:
        kind: schedule
        items:
          - "05:30 PM: Bus to Brewery"
          - "06:00 PM - 09:00 PM: Tour / Banquet"
          - "09:00 PM: Bus to conference venue"
